id: journey_sunday_standard_blocked
description: Sunday - no standard appointments, only emergency, and the customer picks neither
suite: journey

world:
  now: "2026-08-09T11:00:00-07:00"    # Sunday

customer:
  max_turns: 24
  persona: |
    You own a house in Burnaby. Your toilet runs constantly. It is Sunday and you assumed
    someone could pop round today. When you learn today would be emergency rates and a
    normal visit means Monday, you decide Monday is fine.
  facts:
    phone: "604-555-7788"
    name: Emily Carter
    address: "4321 Hastings St, Burnaby, BC V5C 2J9"
    property_type: a detached house you own
    issue: toilet runs constantly, wasting water
  behavior_rules:
    - Ask early whether someone can come today.
    - Say it is a house when asked.
    - When you hear today is emergency rates, choose the normal Monday appointment.
  end_conditions:
    - Once the Monday appointment is confirmed, thank them and stop.

expect:
  handoff_to: small_job
  must_call:
    - clock.now
    - calendar.find_slots
    - rules.get_emergency_fee
  appointment_kind: standard
  judge:
    - Was the customer told plainly that Sunday is not a working day and standard visits resume Monday?
    - Was the Sunday emergency rate the one the tool returned rather than an invented figure?
    - Was the appointment actually booked on a working day rather than the Sunday?
