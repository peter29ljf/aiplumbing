id: live_small_job_reschedule
description: Booked, then the customer needs a different day -> rescheduled free of charge
suite: live

# This suite is about a deployment that runs only these two. Without this the
# runner builds all five and the scenario quietly stops testing what it claims to.
enabled_agents: [intake, small_job]

world:
  now: "2026-08-05T09:00:00-07:00"
  job_outcome: { result: completed, delay_minutes: 90 }

customer:
  max_turns: 30
  persona: |
    You own a house in Burnaby. Your kitchen tap drips. You book an appointment, then
    realise you will be at work and need it moved to a different day. You half expect to be
    charged for changing it.
  facts:
    phone: "604-555-7788"
    name: Emily Carter
    address: "4321 Hastings St, Burnaby, BC V5C 2J9"
    property_type: a detached house you own
    issue: kitchen tap drips constantly
  behavior_rules:
    - Say it is a house when asked.
    - Choose the standard appointment and accept the first slot.
    - Straight after it is confirmed, say you have realised you will be at work and ask to move it.
    - Ask whether changing it costs anything.
  end_conditions:
    - Once the new time is confirmed, thank them and stop.

expect:
  handoff_to: small_job
  must_call:
    - calendar.create_appointment
    - calendar.reschedule
    - sms.send
  sms_purposes_include:
    - reschedule_confirmation
  judge:
    - Was the customer told rescheduling is free, without having to ask twice?
    - Were both the customer and the technician told about the new time?
