# What this deployment actually turns on.
#
# The other agents are not deleted — their prompts and scenarios are assets for the day
# they go live. They are simply unreachable here, and everything that could route to them
# has to know that: the system prompt must not advertise them, and handoff.transfer must
# refuse rather than report success a moment before the conversation layer says otherwise.
#
# The flows left off are the ones holding deposits and refunds. Anything they would have
# handled is taken down as a message and given to a person.

enabled_agents:
  - intake
  - small_job

entry_agent: intake

# Browsers that may call the chat endpoints from a page.
#
# The widget is served from www.smartstrategy.services and the app answers on the apex
# domain, so every request the site makes is cross-origin and the browser will not hand
# the answer back without permission. Nothing said so, which is why the chat never worked:
# the server returned 200 and the browser threw it away.
#
# A list rather than `*`, because these endpoints spend money on a model call and carry a
# session id. `*` would let any page on the internet run up the bill and read the replies.
# Exact origins, scheme included — an origin is not a hostname.
web_chat_origins:
  - "https://www.smartstrategy.services"
  - "https://smartstrategy.services"
