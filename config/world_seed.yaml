# Prior chat transcripts, surfaced by chat.get_history. Customers routinely say
# "your guy told me last time that..." — this is how the agent checks instead of
# taking their word for it.
chat_history:
  - phone: "+16045550101"
    at: "2026-03-14T16:20:00-07:00"
    channel: "chat"
    summary: "Booked the original kitchen sink leak repair"
    transcript: |
      Customer: there is water under my kitchen sink, the cabinet floor is damp
      Agent: I can get a technician out tomorrow afternoon. The call-out is CAD 100 to
        start, credited against the repair if you go ahead with the quote.
      Customer: fine, book it
      Agent: Booked for 15 March, 14:00-16:00, Mike Wang attending.

  - phone: "+16045550102"
    at: "2026-06-19T10:05:00-07:00"
    channel: "chat"
    summary: "Booked the main drain cleaning; warranty exclusion was stated at the time"
    transcript: |
      Customer: main drain is slow again, water backing up in the basement
      Agent: We can clear that. Note that drain cleaning does not carry our one-year
        workmanship warranty — blockages depend on what goes down the line.
      Customer: yeah ok, just get it cleared
      Agent: Booked for 20 June, Sam Zhao attending.

  - phone: "+17785550105"
    at: "2026-05-09T14:40:00-07:00"
    channel: "chat"
    summary: "Booked boiler service; drain cleaning added on site"
    transcript: |
      Customer: boiler is making a banging noise and the pressure gauge is in the red
      Agent: That needs a technician. Tony Chen can attend 10 May, morning.
      Customer: while he is here can he look at the basement floor drain, it is slow
      Agent: He can. Drain cleaning is billed separately and is not covered by the
        one-year workmanship warranty.

