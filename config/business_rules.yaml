  - { id: "richmond", name: "Richmond", postal_prefixes: ["V6V", "V6W", "V6X", "V6Y", "V7A", "V7B", "V7C", "V7E"] }
  - { id: "burnaby", name: "Burnaby", postal_prefixes: ["V3J", "V3N", "V5A", "V5B", "V5C", "V5E", "V5G", "V5H", "V5J"] }
  - { id: "surrey", name: "Surrey", postal_prefixes: ["V3R", "V3S", "V3T", "V3V", "V3W", "V3X", "V3Z", "V4A", "V4N", "V4P"] }
