# ---------------------------- Safety ------------------------------------
safety:
  advisories:
    - trigger: "Major leak or burst pipe"
      advice: >-
        Please shut off your main water valve immediately and stay away from any
        electrical appliances or outlets that the water may reach.
    - trigger: "Sewage backup"
      advice: >-
        Please avoid contact with the sewage and keep children and pets away from
        the affected area.
  emergency_services_referral:
    triggers: ["gas smell", "fire risk", "electrical shock risk", "risk of injury"]
    advice: >-
      Please leave the building and contact local emergency services (911) and
      FortisBC's 24-hour emergency line immediately. Do not wait for our dispatch,
      and do not operate light switches or anything electrical on your way out.
    note: >-
      The agent must not make technical judgements or give safety assurances about
      gas, electrical or personal-safety hazards.

# ---------------------------- Escalation --------------------------------
escalation:
  triggers:
    - "Customer complaint"
    - "Customer disputes the call-out fee"
    - "Customer challenges the quote"
    - "Customer demands an additional refund"
    - "Technician cannot complete the job"
    - "Dispute over damage caused by the service"
    - "On-site safety incident"
    # A declined card or a deposit that has not landed yet is ordinary and belongs to the
    # agent running that payment step. Escalate only once money has actually moved wrongly,
    # or once our own tools have been tried and it still cannot be completed.
    - "Duplicate charge, failed refund, or a payment our tools cannot complete"
    - "Cancellation refund after the emergency confirmation message has been sent"
    - "Customer disputes a warranty decision"
  ai_must_not:
    - "Accept liability, promise compensation, or issue a refund outside the rules"
    - "Make the final call in place of a supervisor"
