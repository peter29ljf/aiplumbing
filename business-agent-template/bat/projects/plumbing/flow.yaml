entry: greeting
nodes:
  greeting:
    goal: Greet them, and get one plain sentence about what they came for. That is all — no details, no
      diagnosis, no name, no number.
    rules:
    - greeting
    tools:
    - ticket.set_fields
    - step.finished
    sets_status: New Inquiry
    next: identify
  identify:
    goal: Get their phone number, find out whether we know them, and what they came for.
    rules:
    - crm_lookup
    tools:
    - crm.lookup_by_phone
    - ticket.set_fields
    - step.finished
    sets_status: Phone Verified
    branch:
      new: new_customer
      existing: warranty_check
      booking_change: appointment_change
      no_number: no_number
  no_number:
    goal: Answer what can be answered, say what cannot be done without a number, and close.
    rules:
    - no_number
    tools:
    - rules.get_service_options
    - ticket.set_fields
    sets_status: Closed
  appointment_change:
    goal: Find the appointment, put the change in front of the technician, and arrange the follow-up.
    rules:
    - appointment_change
    - handover
    tools:
    - calendar.find_booking
    - technician.notify
    - schedule.create_followup
    - ticket.set_fields
    sets_status: Awaiting Technician Confirmation
  new_customer:
    goal: Take their name, service address and email, and open a record.
    rules:
    - new_customer
    tools:
    - crm.create_customer
    - ticket.set_fields
    - step.finished
    sets_status: Customer Identified
    next: property_ask
  warranty_check:
    goal: Find out whether this is about work we already did for them.
    rules:
    - warranty
    tools:
    - crm.get_warranty_candidates
    - ticket.set_fields
    - step.finished
    sets_status: Customer Identified
    branch:
      claim: warranty_handover
      none: property_ask
  property_ask:
    goal: Establish what kind of property this is, and write it down.
    rules:
    - property_asking
    tools:
    - ticket.set_fields
    - step.finished
    sets_status: Needs Assessment
    next: property_route
  property_route:
    goal: Read the property type off the ticket and take the matching way out.
    rules:
    - property_routing
    tools:
    - step.finished
    sets_status: Needs Assessment
    branch:
      ok: problem
      building_project: large_project
      declined: declined
  declined:
    goal: Say we cannot take it and why, then close.
    rules:
    - declining
    tools:
    - sms.send
    - ticket.set_fields
    sets_status: Closed
  problem:
    goal: Understand the fault well enough to size it.
    rules:
    - problem_intake
    tools:
    - ticket.set_fields
    - step.finished
    sets_status: Needs Assessment
    next: sizing
  sizing:
    goal: Decide whether this is a small repair or a larger project.
    rules:
    - size_classification
    tools:
    - rules.get_job_sizing
    - ticket.set_fields
    - step.finished
    sets_status: Needs Assessment
    branch:
      large: large_project
      small: offer_options
  large_project:
    goal: Ask for photographs by email and put it in front of the technician.
    rules:
    - large_project
    - handover
    tools:
    - ticket.set_fields
    - escalate.raise
    - schedule.create_followup
    sets_status: Escalated to Supervisor
  warranty_handover:
    goal: Put the warranty claim in front of the technician with the old job attached.
    rules:
    - warranty
    - handover
    tools:
    - ticket.set_fields
    - escalate.raise
    - schedule.create_followup
    sets_status: Escalated to Supervisor
  offer_options:
    goal: Put the two ways of being seen side by side, and ask which they want.
    rules:
    - offering
    tools:
    - clock.now
    - calendar.find_slots
    - rules.get_service_options
    - ticket.set_fields
    - step.finished
    sets_status: Awaiting Appointment Selection
    next: service_choice
  service_choice:
    goal: Read which one they chose, and any time they named with it.
    rules:
    - choosing
    tools:
    - ticket.set_fields
    - step.finished
    sets_status: Awaiting Appointment Selection
    branch:
      chose_emergency: emergency
      chose_normal: booking
  emergency:
    goal: Give safety advice if there is a risk, and get it to the technician now.
    rules:
    - emergency
    - handover
    tools:
    - rules.get_safety_advisory
    - ticket.set_fields
    - escalate.raise
    - schedule.create_followup
    sets_status: Escalated to Supervisor
  booking:
    goal: Put it in the diary and tell both sides.
    rules:
    - booking
    tools:
    - calendar.create_appointment
    - ticket.set_fields
    - sms.send
    - technician.notify
    - schedule.create_followup
    sets_status: Appointment Booked
