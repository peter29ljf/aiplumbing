id: node.identify.number_known
description: >-
  The number arrived with the channel, so identify must look it up rather than ask for it.
  Every live channel supplies one — a carrier on SMS and voice, the widget's form on chat —
  and asking somebody for the number they are speaking to us on is the clearest possible
  sign nobody is listening.
now: "2026-08-05T10:00:00-07:00"
seed:
  customers:
    - phone: "604-555-0101"
      name: Linda Zhang
      address: "5900 No. 3 Rd, Richmond"
      email: lzhang@example.com
      property_type: house
start:
  node: identify
  # What `FlowConversation` puts on the ticket before the first word is said.
  known:
    phone: "604-555-0101"
    issue: the kitchen tap has started dripping
customer:
  persona: |
    You are Linda Zhang. The kitchen tap drips. You have already given your number and you
    are mildly irritated if asked for it again — say "I already gave you that" rather than
    repeating it.
  opens: "it's still dripping, what can you do?"
  phone: "604-555-0101"
  max_turns: 4
expect:
  # Recognised from the number it was handed, without a round trip to fetch it.
  reaches: warranty_check
  not_reaches: new_customer
  finishes: false
  must_not_say:
    - "your phone number"
    - "may i have your number"
    - "what number"
